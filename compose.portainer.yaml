name: home-server-dashboard

# Portainer environment 4 on Synology. Production must provide an immutable
# GHCR digest through DASHBOARD_IMAGE; mutable tags such as latest are rejected
# by the deployment tool.
services:
  dashboard:
    image: "${DASHBOARD_IMAGE:?Set the verified GHCR image digest}"
    pull_policy: missing
    container_name: home-server-dashboard
    restart: unless-stopped
    init: true
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      STORAGE_BACKEND: postgresql
      DATABASE_URL: ""
      DATABASE_URL_FILE: /run/secrets/database_url
      DATABASE_POOL_MAX: "5"
      DATABASE_CONNECT_TIMEOUT_MS: "5000"
      DATABASE_QUERY_TIMEOUT_MS: "5000"
      DATA_DIR: /app/data
      HOST_PROC: /host/proc
      HOST_SYS: /host/sys
      HOST_STORAGE: /host/storage/volume1,/host/storage/volume2,/host/storage/volume3
      DOCKER_SOCKET: /var/run/docker.sock
      DOCKER_API_TIMEOUT_MS: "3000"
      IKUAI_BASE_URL: "${IKUAI_BASE_URL:-}"
      IKUAI_TOKEN: ""
      IKUAI_TOKEN_FILE: /run/secrets/ikuai_token
      IKUAI_TIMEOUT_MS: "5000"
      IKUAI_ALLOW_INSECURE_TLS: "${IKUAI_ALLOW_INSECURE_TLS:-false}"
      SERVICE_CHECK_TIMEOUT_MS: "5000"
      SERVICE_ICON_TIMEOUT_MS: "5000"
      SERVICE_ICON_ALLOW_INSECURE_TLS: "false"
      BASIC_AUTH_USERNAME: "${BASIC_AUTH_USERNAME:-}"
      BASIC_AUTH_PASSWORD: "${BASIC_AUTH_PASSWORD:-}"
      TZ: "${TZ:-Asia/Shanghai}"
    volumes:
      - "${DATA_PATH:-/volume2/docker/home-server-dashboard/data}:/app/data"
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /volume1:/host/storage/volume1:ro
      - /volume2:/host/storage/volume2:ro
      - /volume3:/host/storage/volume3:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - "${DATABASE_URL_FILE_PATH:-/volume2/docker/home-server-dashboard/secrets/database_url}:/run/secrets/database_url:ro"
      - "${IKUAI_TOKEN_FILE_PATH:-/volume2/docker/home-server-dashboard/secrets/ikuai_token}:/run/secrets/ikuai_token:ro"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
